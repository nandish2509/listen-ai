<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Listen — Emotional Wellness</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;

      background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,0.9), transparent 30%),
        radial-gradient(circle at 85% 15%, rgba(190,220,255,0.7), transparent 35%),
        radial-gradient(circle at 50% 90%, rgba(210,200,255,0.65), transparent 40%),
        linear-gradient(135deg, #dceeff, #eef3ff, #e9e0ff);

      display: flex;
      justify-content: center;
      align-items: center;

      color: #253858;
      overflow: hidden;
    }

    /* Soft floating background circles */

    .circle {
      position: fixed;
      border-radius: 50%;
      filter: blur(2px);
      opacity: 0.35;
      pointer-events: none;
      animation: float 8s ease-in-out infinite;
    }

    .circle.one {
      width: 180px;
      height: 180px;
      background: #ffffff;
      top: 8%;
      left: 5%;
    }

    .circle.two {
      width: 240px;
      height: 240px;
      background: #c9d9ff;
      bottom: 5%;
      right: 3%;
      animation-delay: 2s;
    }

    .circle.three {
      width: 100px;
      height: 100px;
      background: #d8c8ff;
      top: 55%;
      left: 10%;
      animation-delay: 4s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-20px);
      }
    }

    /* Main card */

    .container {
      width: min(92%, 720px);
      padding: 55px 35px;
      text-align: center;

      background: rgba(255, 255, 255, 0.48);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);

      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 32px;

      box-shadow:
        0 25px 70px rgba(70, 90, 140, 0.18),
        inset 0 1px 1px rgba(255,255,255,0.8);

      position: relative;
      z-index: 2;
    }

    /* Logo */

    .logo {
      width: 82px;
      height: 82px;

      margin: 0 auto 25px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 28px;

      background: linear-gradient(
        145deg,
        rgba(255,255,255,0.9),
        rgba(220,230,255,0.65)
      );

      box-shadow:
        0 12px 30px rgba(80,100,160,0.15),
        inset 0 1px 1px rgba(255,255,255,0.9);

      font-size: 38px;
    }

    /* Heading */

    h1 {
      font-size: clamp(42px, 8vw, 68px);
      font-weight: 700;
      letter-spacing: -2px;
      margin-bottom: 15px;

      background: linear-gradient(
        90deg,
        #4267a8,
        #6874c9,
        #8567b5
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tagline {
      font-size: clamp(20px, 4vw, 28px);
      font-weight: 500;
      color: #3e5278;
      margin-bottom: 18px;
    }

    .description {
      max-width: 500px;
      margin: 0 auto 32px;

      font-size: 16px;
      line-height: 1.7;

      color: #65738e;
    }

    /* Button */

    .start-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      padding: 16px 32px;

      border: none;
      border-radius: 18px;

      background: linear-gradient(
        135deg,
        #5c7fca,
        #766bc5
      );

      color: white;
      font-size: 17px;
      font-weight: 600;

      cursor: pointer;
      text-decoration: none;

      box-shadow:
        0 12px 25px rgba(83, 105, 180, 0.25);

      transition: all 0.25s ease;
    }

    .start-button:hover {
      transform: translateY(-3px);
      box-shadow:
        0 16px 32px rgba(83, 105, 180, 0.32);
    }

    .start-button:active {
      transform: translateY(0);
    }

    /* Privacy line */

    .privacy {
      margin-top: 22px;

      font-size: 13px;
      color: #7b879d;

      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
    }

    /* Bottom right credit */

    .credit {
      position: fixed;

      right: 16px;
      bottom: 12px;

      font-size: 10px;
      letter-spacing: 0.3px;

      color: rgba(65, 78, 110, 0.55);

      z-index: 10;

      user-select: none;
    }

    /* Mobile */

    @media (max-width: 600px) {

      .container {
        padding: 42px 22px;
        border-radius: 27px;
      }

      .logo {
        width: 70px;
        height: 70px;
        font-size: 32px;
        border-radius: 23px;
      }

      .description {
        font-size: 15px;
      }

      .start-button {
        width: 100%;
        max-width: 300px;
      }

      .credit {
        font-size: 9px;
        right: 10px;
        bottom: 8px;
      }
    }
  </style>
</head>

<body>

  <!-- Background decoration -->

  <div class="circle one"></div>
  <div class="circle two"></div>
  <div class="circle three"></div>


  <!-- Main opening page -->

  <main class="container">

    <div class="logo">
      💙
    </div>

    <h1>Listen</h1>

    <div class="tagline">
      You don't have to keep everything inside.
    </div>

    <p class="description">
      A quiet space where you can talk, express what's on your mind,
      and be heard without judgment.
    </p>

    <a href="chat.html" class="start-button">
      Start Talking
      <span>→</span>
    </a>

    <div class="privacy">
      🔒 Anonymous&nbsp; • &nbsp;No account required
    </div>

  </main>


  <!-- Small bottom-right credit -->

  <div class="credit">
    Made by Emotional Wellness
  </div>

</body>
</html>
